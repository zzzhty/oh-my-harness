[package]
name = "omh-manager"
version = "0.0.0"
edition = "2021"
description = "Static omh manager. Pins one interpreter and checks out content; it does not project skills."
publish = false

[[bin]]
name = "omh"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
