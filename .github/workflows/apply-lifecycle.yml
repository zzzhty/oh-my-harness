name: Apply consolidated lifecycle implementation

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/omh-lifecycle-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/omh-lifecycle-cli
          fetch-depth: 0
      - name: Rewrite branch as one implementation commit
        shell: bash
        run: |
          set -euo pipefail
          old_head=$(git rev-parse HEAD)
          cat .github/lifecycle-payload/part-* > "$RUNNER_TEMP/lifecycle.b64"
          git fetch origin main
          git reset --hard origin/main
          base64 --decode "$RUNNER_TEMP/lifecycle.b64" | gzip -dc | git apply --binary
          git config user.name "oh-my-harness automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(manager): complete omh lifecycle management"
          git push \
            --force-with-lease=refs/heads/agent/omh-lifecycle-cli:$old_head \
            origin HEAD:agent/omh-lifecycle-cli
