name: Bootstrap plugin distribution identity

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/plugin-distribution-identity-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply migration
        run: python .github/identity-migration/apply_bootstrap.py

      - name: Bootstrap tooling
        run: python scripts/bootstrap_tooling_env.py --venv .venv

      - name: Derive release identity
        run: .venv/bin/python scripts/update_plugin_generations.py --release-version 1.0.0 --json

      - name: Verify release identity
        run: .venv/bin/python scripts/check_plugin_generations.py

      - name: Run root tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py'

      - name: Run Watcher tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: .venv/bin/python -m unittest discover -s plugins/watcher/tests -p 'test_*.py'

      - name: Run Workflow tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: .venv/bin/python -m unittest discover -s plugins/workflow/tests -p 'test_*.py'

      - name: Recheck generated identity
        run: .venv/bin/python scripts/check_plugin_generations.py

      - name: Validate diff
        run: git diff --check

      - name: Commit generated implementation
        run: |
          git config user.name "oh-my-harness release automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(distribution): derive v1.0.0 plugin identities [identity-generated]"
          git push origin HEAD:agent/plugin-distribution-identity-v1
