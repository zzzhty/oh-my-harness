name: Main source snapshot

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'agent/omh-lifecycle-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-artifact@v4
        with:
          name: main-source-snapshot
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
