name: Content release validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  content:
    name: content (${{ matrix.os }}, Python ${{ matrix.python-version }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated runner tooling dependencies
        run: python -m pip install -r requirements.txt
      - name: Architecture checks
        run: python scripts/check_architecture.py
      - name: Compile content and developer sources
        run: python -m compileall -q scripts tests plugins/maintenance plugins/workflow
      - name: Content tooling tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Independent maintenance skill tests
        run: python -m unittest discover -s plugins/maintenance/tests -p "test_*.py"
      - name: Workflow tests
        run: python -m unittest discover -s plugins/workflow/tests -p "test_*.py"
      - name: Package identity
        run: python scripts/check_plugin_generations.py
      - name: Standalone distribution
        shell: bash
        run: python scripts/check_standalone_distribution.py
      - name: Diff hygiene
        shell: bash
        run: git diff --check
