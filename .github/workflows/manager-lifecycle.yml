name: Content release validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  content:
    name: content (${{ matrix.os }}, Python ${{ matrix.python-version }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated runner tooling dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile content and developer sources
        run: python -m compileall -q scripts tests runtimes/watcher plugins/maintenance plugins/workflow
      - name: Content tooling tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Historical runtime and evidence tests
        run: python -m unittest discover -s runtimes/watcher/tests -p "test_*.py"
      - name: Independent maintenance skill tests
        run: python -m unittest discover -s plugins/maintenance/tests -p "test_*.py"
      - name: Workflow tests
        run: python -m unittest discover -s plugins/workflow/tests -p "test_*.py"
      - name: Package identity
        run: python scripts/check_plugin_generations.py
      - name: Read shared exporter revision
        id: exporter
        shell: bash
        run: echo "revision=$(cat tooling/atm-revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: zzzhty/ai-tooling-manager
          ref: ${{ steps.exporter.outputs.revision }}
          path: .atm-exporter
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .atm-exporter/target
          key: ${{ runner.os }}-omh-exporter-${{ steps.exporter.outputs.revision }}
      - name: Build the shared Rust exporter
        working-directory: .atm-exporter
        run: cargo build --locked -p atm-cli
      - name: Export import and client projection contract
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          python scripts/check_content_export.py --atm ".atm-exporter/target/debug/atm${suffix}"
      - name: Diff hygiene
        shell: bash
        run: git diff --check
