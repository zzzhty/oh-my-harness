name: Finalize scope discipline candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  finalize-branch:
    name: finalize branch candidate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/scope-discipline-milestone-gate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling dependencies
        run: python -m pip install -r requirements.txt
      - name: Update Watcher metadata snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("plugins/watcher/tests/test_skill_watcher.py")
          text = path.read_text(encoding="utf-8")

          replacements = (
              (
                  "self.assertEqual(len(watcher_identities), 34)",
                  "self.assertEqual(len(watcher_identities), 35)",
              ),
              (
                  "            144,\n        )\n        self.assertEqual(\n"
                  "            sum(len(values[\"supporting_skills\"])",
                  "            147,\n        )\n        self.assertEqual(\n"
                  "            sum(len(values[\"supporting_skills\"])",
              ),
              (
                  '{"discipline": 6, "entrypoint": 2, "specialized": 23, "wrapper": 3}',
                  '{"discipline": 7, "entrypoint": 2, "specialized": 23, "wrapper": 3}',
              ),
          )
          for old, new in replacements:
              if new in text and old not in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one old snapshot value or the final value, found {count}: {old!r}"
                  )
              text = text.replace(old, new)

          group_old = '            "workflow:prompt-strategy-loop": "implicit-primitives",\n'
          group_new = (
              group_old
              + '            "workflow:scope-discipline": "guardrails",\n'
          )
          if group_new not in text:
              count = text.count(group_old)
              if count != 1:
                  raise SystemExit(f"expected one local group insertion point, found {count}")
              text = text.replace(group_old, group_new)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Generate plugin identities
        run: python scripts/update_plugin_generations.py
      - name: Validate final candidate
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests plugins/watcher plugins/workflow
          python -m unittest discover -s tests -p "test_*.py"
          python -m unittest discover -s plugins/watcher/tests -p "test_*.py"
          python -m unittest discover -s plugins/workflow/tests -p "test_*.py"
          python scripts/check_plugin_generations.py
          git diff --check
      - name: Commit final candidate
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add \
            plugins/watcher/tests/test_skill_watcher.py \
            plugins/watcher/.codex-plugin/plugin.json \
            plugins/workflow/.codex-plugin/plugin.json \
            .agents/plugins/distribution-identity.json
          if git diff --cached --quiet; then
            echo "final candidate is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize scope discipline package"
          git push origin "HEAD:${HEAD_BRANCH}"
