name: Temporary manager review fixes

on:
  push:
    branches: [fix/manager-repair-cli-20260913]
    paths: [.github/workflows/omh-review-fixes.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated review fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2610893b820a68d4c16de156ca7ff50606c4fd77
          python - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          url = 'https://api.github.com/repos/zzzhty/oh-my-harness/git/blobs/d3e3e78db0e225489aa5627d8e06bd4e27544f13'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          patch = gzip.decompress(base64.b64decode(payload['content']))
          if hashlib.sha256(patch).hexdigest() != 'f5c8895bdebf62692c923a0536373b2f26d3a4e0f8b48bec3f454151c9558c60':
              raise SystemExit('Transport does not match the locally validated patch')
          path = Path(os.environ['RUNNER_TEMP']) / 'review-fixes.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git rm .github/workflows/omh-review-fixes.yml
          python -m compileall -q scripts tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(manager): restore rollback launchers and retain external profile ownership'
          git push origin HEAD:refs/heads/fix/manager-repair-cli-20260913
          echo "Review fixes committed: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
